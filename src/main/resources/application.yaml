server:
  port: 8087

spring:
  application:
    name: ms-andesstay-report

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://sts.windows.net/524de923-14d5-4e21-bbbf-525ca2e1ced7/
          jwk-set-uri: https://login.microsoftonline.com/524de923-14d5-4e21-bbbf-525ca2e1ced7/discovery/keys

  # EP5 - Kafka. Consume reservations.events y audit.timeline con el grupo report-group.
  # Docker: KAFKA_BOOTSTRAP_SERVERS=kafka1:29092,kafka2:29092,kafka3:29092
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    client-id: ms-andesstay-report
    consumer:
      # Grupo distinto al de audit: report recibe TODOS los eventos, igual que audit
      group-id: ${KAFKA_CONSUMER_GROUP:report-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 100
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.use.type.headers: false
        # Tipo por defecto; el listener de audit.timeline lo sobrescribe con su propio DTO
        spring.json.value.default.type: com.andesstay.ms_andesstay_report.kafka.ReservationEventMessage
        spring.json.trusted.packages: com.andesstay.ms_andesstay_report.kafka
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
        session.timeout.ms: 45000
    producer:
      # Solo se usa para publicar en los DLT
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
    listener:
      ack-mode: record
      concurrency: 3
      missing-topics-fatal: false

# Sin base de datos: los KPIs se calculan al momento consultando por REST (JWT del usuario propagado).
# En Docker usar los nombres de servicio de infra/compose.yml, ej. RESERVATIONS_URL=http://reservations:8081
andesstay:
  services:
    reservations:
      url: ${RESERVATIONS_URL:http://localhost:8081}
    audit:
      url: ${AUDIT_URL:http://localhost:8086}
    connect-timeout: 2s
    read-timeout: 10s

  # EP5 - Tópicos que consume report y sus DLT (uno por consumidor y tópico)
  kafka:
    reservation-events-topic: reservations.events
    audit-timeline-topic: audit.timeline
    dead-letter:
      partitions: 3
      replicas: 3
      retention: ${KAFKA_DLT_RETENTION:14d}
      min-insync-replicas: 2
      # El DLT de cada tópico es <topico>.report.DLT
      suffix: .report.DLT
    retry:
      max-attempts: ${KAFKA_RETRY_MAX_ATTEMPTS:3}
      initial-interval: 1s
      multiplier: 2.0
      max-interval: 10s

# Solo /actuator/health (healthcheck de Docker)
management:
  endpoints:
    web:
      exposure:
        include: health
